name: Java CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Debug message (so you know workflow is firing)
      - name: Print debug message
        run: echo "✅ Workflow triggered successfully!"

      # Step 3: Set up JDK
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 4: Download JUnit & Hamcrest jars
      - name: Download JUnit
        run: |
          curl -L -o junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -L -o hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      # Step 5: Compile code + tests
      - name: Compile
        run: javac -cp .:junit-4.13.2.jar:hamcrest-core-1.3.jar LeapYear.java tests/LeapYearTest.java

      # Step 6: Run JUnit tests
      - name: Run Tests
        run: java -cp .:junit-4.13.2.jar:hamcrest-core-1.3.jar org.junit.runner.JUnitCore LeapYearTest

